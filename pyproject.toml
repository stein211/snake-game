[project]
name = "snake-game"
version = "1.0.0"
description = "A polished, well-structured Snake game built with pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
